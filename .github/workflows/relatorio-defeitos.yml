name: Relatorio Defeitos LT-PRO

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

jobs:
  gerar-relatorio:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run report script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID_PRODUCAO: ${{ secrets.SPREADSHEET_ID_PRODUCAO }}
          SPREADSHEET_ID_DEFEITOS: ${{ secrets.SPREADSHEET_ID_DEFEITOS }}
        run: |
          python analise_comparativa_defeitos_LT-PRO_2026.py

      - name: Upload generated reports
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-defeitos
          path: |
            relatorio_comparativo_*.html
          if-no-files-found: error
