name: Relatorio Defeitos LT-PRO

on:
  workflow_dispatch:
  schedule:
    # GitHub cron usa UTC. 23:00 BRT (UTC-3) = 02:00 UTC no dia seguinte.
    - cron: "0 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gerar-relatorio:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run report script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID_PRODUCAO: ${{ secrets.SPREADSHEET_ID_PRODUCAO }}
          SPREADSHEET_ID_DEFEITOS: ${{ secrets.SPREADSHEET_ID_DEFEITOS }}
        run: |
          python analise_comparativa_defeitos_LT-PRO_2026.py

      - name: Prepare Pages content
        run: |
          mkdir -p public
          latest_file=$(ls -t relatorio_comparativo_*.html | head -n 1)
          cp "$latest_file" public/index.html
          cp "$latest_file" "public/$latest_file"

      - name: Upload generated reports
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-defeitos
          path: |
            relatorio_comparativo_*.html
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
